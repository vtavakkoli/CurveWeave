name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install metadata only
        run: npm install --package-lock-only --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Unit tests
        run: npm test
